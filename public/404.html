<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages has no server-side routing, so a hard navigation to any
      // client-side route (e.g. /tv-time-2-0) 404s here. Encode the path into
      // a query string and redirect to index.html, which restores it (see
      // the matching script in index.html). https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // number of path segments in the GitHub Pages base, e.g. "/pmkarandalal"
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
